name: Loopr
options:
  bundleIdPrefix: dev.willsawyerrrr
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  RouteKit:
    path: RouteKit
targets:
  Loopr:
    type: application
    platform: iOS
    sources: [Loopr]
    dependencies:
      - package: RouteKit
    info:
      path: Loopr/Info.plist
      properties:
        CFBundleDisplayName: Loopr
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocationWhenInUseUsageDescription: Loopr can start a route from where you are.
        NSCalendarsFullAccessUsageDescription: Loopr reads your Runna calendar to find your upcoming runs and their workouts.
        BGTaskSchedulerPermittedIdentifiers: [dev.willsawyerrrr.loopr.refresh]
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.loopr
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  LooprTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LooprTests, Loopr/ScreenshotOCR.swift]
    dependencies:
      - package: RouteKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.willsawyerrrr.loopr.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Loopr:
    build:
      targets:
        Loopr: all
    run:
      config: Debug
    test:
      config: Debug
      targets: [LooprTests]
